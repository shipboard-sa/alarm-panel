<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ============ SECTION 1: SYSTEM CONTEXT ============ -->
  <text x="400" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#0B2545">System context</text>

  <!-- Power supply -->
  <rect x="30" y="55" width="130" height="50" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="95" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#854F0B">12 V ship's DC</text>
  <text x="95" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#854F0B">fused supply</text>

  <!-- Automation engine box -->
  <rect x="30" y="130" width="130" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="95" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0F6E56">Automation</text>
  <text x="95" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0F6E56">engine (Pi)</text>

  <!-- Arrow: engine -> panel -->
  <line x1="160" y1="160" x2="235" y2="160" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="198" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">GPIO /</text>
  <text x="198" y="163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">Modbus</text>

  <!-- Arrow: power -> panel -->
  <line x1="160" y1="80" x2="310" y2="80" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="310" y1="80" x2="310" y2="115" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="240" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">+12 V / GND</text>

  <!-- Alarm panel PCB (large box) -->
  <rect x="240" y="118" width="290" height="132" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="385" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#993C1D">Alarm panel PCB</text>

  <!-- Internal sub-boxes inside the panel -->
  <!-- LED array -->
  <rect x="256" y="150" width="95" height="36" rx="4" fill="#fff" stroke="#993C1D" stroke-width="0.5"/>
  <text x="303" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2C2C2A">LED array</text>

  <!-- Driver channels -->
  <rect x="362" y="150" width="95" height="36" rx="4" fill="#fff" stroke="#993C1D" stroke-width="0.5"/>
  <text x="409" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2C2C2A">NPN driver</text>
  <text x="409" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2C2C2A">channels</text>

  <!-- Mute / Test -->
  <rect x="256" y="196" width="70" height="28" rx="4" fill="#fff" stroke="#993C1D" stroke-width="0.5"/>
  <text x="291" y="214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2C2C2A">Mute btn</text>

  <rect x="336" y="196" width="70" height="28" rx="4" fill="#fff" stroke="#993C1D" stroke-width="0.5"/>
  <text x="371" y="214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2C2C2A">Test btn</text>

  <!-- Power indicator -->
  <rect x="416" y="196" width="100" height="28" rx="4" fill="#fff" stroke="#993C1D" stroke-width="0.5"/>
  <text x="466" y="214" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2C2C2A">Power LED</text>

  <!-- Arrow: panel -> faceplate -->
  <line x1="530" y1="180" x2="590" y2="180" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Faceplate -->
  <rect x="595" y="118" width="170" height="132" rx="8" fill="#fff" stroke="#0B2545" stroke-width="1"/>
  <text x="680" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0B2545">Faceplate</text>

  <!-- Backlit label slots (visual) -->
  <rect x="615" y="152" width="130" height="16" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.4"/>
  <text x="680" y="163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#993C1D">BILGE HIGH WATER</text>
  <rect x="615" y="172" width="130" height="16" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.4"/>
  <text x="680" y="183" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#993C1D">ENGINE OVERHEAT</text>
  <rect x="615" y="192" width="130" height="16" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.4"/>
  <text x="680" y="203" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#993C1D">ANCHOR DRAG</text>
  <rect x="615" y="212" width="130" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.4"/>
  <text x="680" y="223" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#73726C">... (24-32 labels)</text>

  <!-- Divider -->
  <line x1="30" y1="275" x2="770" y2="275" stroke="#0B2545" stroke-width="0.3" stroke-dasharray="6 4"/>

  <!-- ============ SECTION 2: PER-CHANNEL CIRCUIT ============ -->
  <text x="400" y="302" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#0B2545">Per-channel circuit (one of 24-32)</text>

  <!-- Main circuit area -->
  <!-- +12V rail at top -->
  <line x1="420" y1="340" x2="420" y2="330" stroke="#993C1D" stroke-width="1.2"/>
  <line x1="370" y1="330" x2="470" y2="330" stroke="#993C1D" stroke-width="1.5"/>
  <text x="420" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#993C1D">+12 V rail</text>

  <!-- Current-limiting resistor (rectangle style) -->
  <rect x="412" y="340" width="16" height="40" rx="1" fill="none" stroke="#2C2C2A" stroke-width="1"/>
  <text x="440" y="365" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#73726C">R 330 &#x2126;</text>

  <!-- Wire from resistor to LED -->
  <line x1="420" y1="380" x2="420" y2="400" stroke="#2C2C2A" stroke-width="1"/>

  <!-- LED (triangle + arrows) -->
  <polygon points="405,400 435,400 420,425" fill="none" stroke="#2C2C2A" stroke-width="1"/>
  <line x1="405" y1="425" x2="435" y2="425" stroke="#2C2C2A" stroke-width="1"/>
  <!-- Light emission arrows -->
  <line x1="438" y1="406" x2="450" y2="396" stroke="#993C1D" stroke-width="0.8" marker-end="url(#arr)"/>
  <line x1="442" y1="414" x2="454" y2="404" stroke="#993C1D" stroke-width="0.8" marker-end="url(#arr)"/>
  <text x="460" y="410" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#73726C">LED</text>
  <text x="460" y="422" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">(green, 3mm)</text>

  <!-- Wire from LED to transistor collector -->
  <line x1="420" y1="425" x2="420" y2="450" stroke="#2C2C2A" stroke-width="1"/>

  <!-- NPN transistor (simplified schematic) -->
  <!-- Collector at top, emitter at bottom, base from left -->
  <circle cx="420" cy="475" r="20" fill="none" stroke="#2C2C2A" stroke-width="1"/>
  <!-- Vertical base line -->
  <line x1="400" y1="462" x2="400" y2="488" stroke="#2C2C2A" stroke-width="1.2"/>
  <!-- Collector line -->
  <line x1="400" y1="465" x2="420" y2="455" stroke="#2C2C2A" stroke-width="1"/>
  <line x1="420" y1="455" x2="420" y2="450" stroke="#2C2C2A" stroke-width="1"/>
  <!-- Emitter line with arrow -->
  <line x1="400" y1="485" x2="420" y2="495" stroke="#2C2C2A" stroke-width="1"/>
  <polygon points="415,493 420,495 416,499" fill="#2C2C2A" stroke="none"/>

  <text x="448" y="472" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#73726C">Q NPN</text>
  <text x="448" y="484" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">(2N2222)</text>

  <!-- Base resistor (horizontal) -->
  <line x1="340" y1="475" x2="355" y2="475" stroke="#2C2C2A" stroke-width="1"/>
  <rect x="355" y="469" width="30" height="12" rx="1" fill="none" stroke="#2C2C2A" stroke-width="1"/>
  <line x1="385" y1="475" x2="400" y2="475" stroke="#2C2C2A" stroke-width="1"/>
  <text x="370" y="464" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#73726C">R 1k&#x2126;</text>

  <!-- Input signal label -->
  <rect x="200" y="460" width="135" height="30" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="267" y="479" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#0F6E56">Signal from engine</text>
  <line x1="335" y1="475" x2="340" y2="475" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="267" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">3.3 V logic (HIGH = alarm active)</text>

  <!-- Emitter to ground -->
  <line x1="420" y1="495" x2="420" y2="525" stroke="#2C2C2A" stroke-width="1"/>
  <!-- Ground symbol -->
  <line x1="408" y1="525" x2="432" y2="525" stroke="#2C2C2A" stroke-width="1.2"/>
  <line x1="412" y1="530" x2="428" y2="530" stroke="#2C2C2A" stroke-width="1"/>
  <line x1="416" y1="535" x2="424" y2="535" stroke="#2C2C2A" stroke-width="0.8"/>
  <text x="420" y="550" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#73726C">GND</text>

  <!-- ============ MUTE / TEST CIRCUITS ============ -->

  <!-- Mute circuit (right side) -->
  <rect x="580" y="330" width="185" height="95" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.7"/>
  <text x="672" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#854F0B">Mute circuit</text>
  <text x="672" y="366" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#854F0B">Momentary pushbutton toggles</text>
  <text x="672" y="378" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#854F0B">a common inhibit line that</text>
  <text x="672" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#854F0B">gates all NPN base signals.</text>
  <text x="672" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#854F0B">LEDs go dark; alarms stay latched.</text>

  <!-- Test circuit (right side) -->
  <rect x="580" y="440" width="185" height="82" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
  <text x="672" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#0F6E56">Test circuit</text>
  <text x="672" y="476" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0F6E56">Momentary pushbutton bypasses</text>
  <text x="672" y="488" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0F6E56">NPN drivers to pull all LEDs to</text>
  <text x="672" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0F6E56">+12 V. Confirms lamp health.</text>

  <!-- How it works note -->
  <rect x="50" y="570" width="700" height="75" rx="8" fill="#F5F5F0" stroke="#2C2C2A" stroke-width="0.4"/>
  <text x="400" y="592" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#0B2545">How it works</text>
  <text x="400" y="610" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2C2C2A">When the automation engine asserts a 3.3 V signal, the NPN turns on, sinking current through the LED.</text>
  <text x="400" y="625" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2C2C2A">This pull-to-ground pattern repeats identically for each alarm channel (typically 24-32 channels on one PCB).</text>
  <text x="400" y="640" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2C2C2A">The faceplate uses backlit label slots so each LED illuminates a human-readable alarm name.</text>

  <!-- Border -->
  <rect x="1" y="1" width="798" height="678" rx="0" fill="none" stroke="#E0E0E0" stroke-width="0.5"/>
</svg>
